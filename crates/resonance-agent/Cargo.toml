[package]
name = "resonance-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Executable entry point for Resonance Signal"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "=3.0.11"

[dependencies]
resonance-api = { path = "../resonance-api" }
resonance-core = { path = "../resonance-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
axum = { version = "0.8", features = ["json", "query", "ws"] }
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
wasapi = "=0.24.0"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
